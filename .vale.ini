# House198x prose style, applied to this site. Ported from
# emu198x.github.io's .vale.ini.
#
# The page is .astro, and vale does not know that extension: running
# `vale src/pages/index.astro` reported "0 errors ... in 0 files" and exited
# 0. It scanned nothing and called it success, which is the failure mode
# this repository's gates exist to remove.
#
# The gate therefore runs over the BUILT HTML rather than the source — see
# scripts/check-prose.mjs. That is the prose a reader actually gets, and it
# excludes the Astro frontmatter, which is JavaScript and not reader-facing
# copy.
#
# Run it with `npm run prose`, never bare `vale`: the wrapper fails when no
# file was scanned, which bare vale reports as a pass.
#
# Self-contained on purpose, for the same reason emu198x.github.io's is: a
# StylesPath into the umbrella checkout resolves to nothing in CI, where this
# repository is checked out alone. The styles are fetched into this repo
# instead, from the same release the rest of the family pulls, so the gate
# reads the same rules everywhere.
#
# .vale/ is gitignored: it is a synced artifact, like _198x-ui.
# Setup (once, and after a house-style release):  vale sync
StylesPath = .vale
Packages = https://github.com/stevehill1981/house-style/releases/latest/download/House198x.zip
MinAlertLevel = suggestion

[formats]
astro = html

[*.html]
BasedOnStyles = House198x
# Passive voice is the noisiest rule and often correct in technical prose.
House198x.Passive = NO
